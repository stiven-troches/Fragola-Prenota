<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FRAGOLA PRENOTA | Reservas y gestión de citas</title>
<meta name="description" content="FRAGOLA PRENOTA: reservas en línea y gestión de citas para barberías, spas y peluquerías. Una solución de la familia FRAGOLA.">
<meta name="theme-color" content="#0b1b3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1b3a'/%3E%3Cg transform='translate%2816 17.4%29 scale%28.74%29 translate%28-12 -13.5%29'%3E%3Cpath fill='%23d7263d' d='M12 22C6.5 19.5 4 14.5 4.5 10.5 5 7.5 8 6.5 12 8c4-1.5 7-.5 7.5 2.5.5 4-2 9-7.5 11.5z'/%3E%3Cpath fill='%23fff' d='M12 8 8 4.5l4 1 4-2-1.5 3.8z'/%3E%3Cpath d='M12 11.6v3.4l2.3 1.4' fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--soft:#f3f6fc;--ink:#0b1b3a;--mute:#56627f;--line:#d9e2f2;--blue:#1746c4;--blue-d:#0f3299;--blue-soft:#e8efff;--red:#d7263d;--red-d:#b01c30;--red-soft:#fde8eb;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 120px}
svg.i{vertical-align:-3px;flex:none}
header.top{background:var(--bg);border-bottom:3px solid var(--red);margin:0 -16px 14px;padding:10px 16px}
header .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--blue);letter-spacing:.02em}.logo b{color:var(--red)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--mute);padding:7px 12px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px}
nav.tabs button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
nav.tabs button[aria-current=true]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-d)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h1,h2,h3{margin:0 0 8px;letter-spacing:-.01em}h1{font-size:21px}h2{font-size:18px;display:flex;align-items:center;gap:8px}h3{font-size:16px}
.mute{color:var(--mute);font-size:14px}
.profile{display:flex;gap:14px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.steps{display:flex;gap:6px;margin:0 0 10px;padding:0;list-style:none}.steps li{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps li.on{background:var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:130px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
input[type=checkbox],input[type=radio]{width:auto}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:4px 0}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.opt .n{font-weight:700}.opt .p{font-weight:700;white-space:nowrap;color:var(--blue-d)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.day{flex:none;width:62px;padding:8px 0;text-align:center;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font:inherit;cursor:pointer}
.day small{display:block;color:var(--mute);text-transform:capitalize}.day b{font-size:18px}
.day[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}.day[aria-pressed=true] small{color:#fff}
.day:disabled{opacity:.4;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.slot{padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.slot[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--blue);color:#fff;padding:10px 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
.btn.danger{background:var(--red);color:#fff}.btn.dghost{background:#fff;color:var(--red-d);border:1px solid var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:3px solid var(--blue);padding:10px 16px;z-index:5}
.bar .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.err{color:var(--red-d);font-size:13px;margin-top:4px;display:flex;gap:6px;align-items:center}
.okt{color:var(--blue-d);font-weight:700;display:flex;gap:8px;align-items:center}
.notice{font-size:13px;color:var(--mute);border-left:4px solid var(--red);padding:6px 10px;margin:10px 0;background:var(--soft);border-radius:0 8px 8px 0}
.code{font:800 28px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--blue)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mute);font-weight:600}
td input,td select{padding:6px 8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--blue-soft);color:var(--blue-d);white-space:nowrap}
.pill.s-en{background:var(--blue);color:#fff}.pill.s-co{background:#eef1f7;color:var(--mute)}.pill.s-no{background:var(--red-soft);color:var(--red-d)}.pill.s-ca{background:#fff;border:1px solid var(--red);color:var(--red-d)}.pill.red{background:var(--red-soft);color:var(--red-d)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:var(--r);padding:12px}.kpi.r{border-top-color:var(--red)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em}.kpi .l{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.bars .b{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bars .t{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.bars .t i{display:block;height:100%;background:var(--blue);border-radius:6px}.bars.r .t i{background:var(--red)}
.appt{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}
.appt.x{border-left-color:var(--red);opacity:.8}
.appt .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(11,27,58,.55);display:grid;place-items:center;padding:16px;z-index:20}
.overlay .card{max-width:380px;width:100%;margin:0}
footer{font-size:12px;color:var(--mute);text-align:center;margin-top:20px}
details summary{cursor:pointer;font-weight:600}

/* ===== FRAGOLA PRENOTA: identidad (azul marino, blanco, neutros y rojo fresa) ===== */
:root{--soft:#f4f5f8;--ink:#0b1b3a;--mute:#566079;--line:#dde1ea;--blue:#14284f;--blue-d:#0b1b3a;--blue-soft:#e8ecf4;--red:#d7263d;--red-d:#b01c30;--red-soft:#fde8eb;--navy:#0b1b3a;--red-l:#ff7a8d}
header.top{background:var(--navy);border-bottom:3px solid var(--red)}
header.top button:focus-visible{outline-color:#fff}
.logo{color:#fff;gap:10px}
.wm{display:flex;flex-direction:column;line-height:1;gap:4px}
.wm1{font-weight:800;letter-spacing:.16em;font-size:17px}
.wm2{font-weight:600;letter-spacing:.34em;font-size:10px;color:var(--red-l)}
.seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.seg button{color:#c9d1e3}.seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
.steps li.on{background:var(--red)}
nav.tabs button[aria-current=true]{box-shadow:inset 0 -3px 0 var(--red)}
.empty{text-align:center;padding:28px 16px}
.empty .ico{width:52px;height:52px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin:0 auto 10px}
.empty .acts{justify-content:center}
.demo-banner{background:var(--red-soft);border:1px solid var(--red);color:var(--red-d);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.steps-list{list-style:none;margin:0;padding:0}
.steps-list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.steps-list li>div{flex:1;min-width:0}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.dot.ok{background:var(--blue);border-color:var(--blue)}
.overlay .card{max-height:90vh;overflow:auto}
footer .ft{display:flex;gap:6px;justify-content:center;align-items:center;margin-bottom:4px;color:var(--ink);font-size:13px}
footer>div{margin-top:2px}
.shell{display:block}
@media(max-width:520px){.seg button span{display:none}.seg button{padding:9px 12px}.wm1{font-size:15px}}
@media(min-width:960px){
  body.adm .wrap{max-width:1240px}body.adm header .in{max-width:1240px}
  .shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
  nav.tabs.side{flex-direction:column;overflow:visible;position:sticky;top:12px;padding:0}
  nav.tabs.side button{justify-content:flex-start;box-shadow:none}
  nav.tabs.side button[aria-current=true]{box-shadow:inset 3px 0 0 var(--red)}
}

/* ===== Fase 2: calendario y gestion de citas ===== */
:root{--amb:#8a5a00;--amb-soft:#fff6e0;--amb-line:#c58a12}
.pill.s-pe{background:var(--amb-soft);color:var(--amb);border:1px dashed var(--amb-line)}
.card.wide{max-width:560px}
.kvs{margin:10px 0}.kv{display:grid;grid-template-columns:104px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.svclist{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.cal-head{padding:12px 14px}
.cal-ttl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}.cal-ttl h2{margin:0}
.cal-title{font-weight:700;color:var(--navy)}
.cal-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cal-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.cal-nav .btn{flex:none;min-width:0}
.cal-date{width:auto;padding:6px 8px}
.cal-tools .chips{padding:0}
.cal-filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:flex-end}.cal-filters>div{flex:1 1 140px;min-width:120px}.cal-filters label{margin:0 0 3px;font-size:12px}.cal-filters select{padding:7px 8px}.cal-filters .fx{flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px;font-size:12px;color:var(--mute);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;border:1px solid var(--line)}.sw-off{background:repeating-linear-gradient(45deg,#e4e7ee 0 4px,#f4f5f8 4px 8px)}.sw-blk{background:repeating-linear-gradient(45deg,#f6c9d0 0 4px,#fde8eb 4px 8px)}.sw-now{background:var(--red);height:3px;border:0}
.av{width:28px;height:28px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.hn{display:flex;flex-direction:column;min-width:0;line-height:1.2;text-align:left}.hn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hn small{color:var(--mute);font-size:11px;font-weight:500}
/* cuadricula horaria */
.tg{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:auto;max-height:74vh;position:relative}
.tg-in{display:grid;min-width:min-content}
.tg-hd{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px 8px;display:flex;gap:8px;align-items:center;min-height:48px}
.tg-hd.today{background:var(--blue-soft)}
.tg-corner{left:0;z-index:6;border-left:0}
.tg-gut{position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line)}
.tg-t{position:absolute;right:6px;font-size:11px;color:var(--mute);transform:translateY(-50%);background:#fff;padding:0 2px}
.tg-t:first-child{transform:none}
.tg-col{position:relative;border-left:1px solid var(--line);cursor:copy;background-image:linear-gradient(var(--line) 1px,transparent 1px)}
.tg-col.today{background-color:#fafbff}
.off{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#e4e7ee 0 6px,#f4f5f8 6px 12px);cursor:not-allowed;z-index:0;display:flex;justify-content:center;align-items:flex-start;padding-top:6px}
.off span{font-size:11px;color:var(--mute);background:#fffc;padding:1px 6px;border-radius:6px}
.blk{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#f6c9d0 0 6px,#fde8eb 6px 12px);z-index:0;font-size:11px;color:var(--red-d);padding:2px 6px;overflow:hidden;cursor:not-allowed}
.ev{position:absolute;left:3px;right:3px;border:1px solid #9db3e0;border-left:4px solid var(--pc,var(--navy));border-radius:8px;padding:2px 6px;overflow:hidden;font:inherit;font-size:12px;line-height:1.25;text-align:left;cursor:pointer;background:#e3eafa;color:var(--ink);z-index:1;display:block;cursor:grab}
.ev .t{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev .s{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.drag{opacity:.4}
.ev-pe{background:var(--amb-soft);border:1px dashed var(--amb-line);border-left:4px solid var(--pc,var(--amb-line));color:#5a3c00}
.ev-en{background:var(--navy);color:#fff;border-color:var(--navy)}
.ev-co{background:#eef0f4;color:var(--mute);border-color:#d3d8e3}
.ev-no{background:var(--red-soft);color:var(--red-d);border-color:var(--red)}
.ev-ca{background:#fff;border:1px dashed var(--red);border-left:4px dashed var(--red);color:var(--red-d);text-decoration:line-through;opacity:.85;left:55%;z-index:2}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--red);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-1px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.nowtag{right:0;left:auto;width:auto;border:0;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px 0 0 4px;height:auto;transform:translateY(-50%);z-index:5}.nowtag::before{display:none}
/* matriz semanal */
.wk-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.wk{display:grid;min-width:min-content}
.wk-h{background:#fff;border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px;font:inherit;text-align:center;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;position:sticky;top:0;z-index:2}
.wk-h small{color:var(--mute);text-transform:capitalize}.wk-h b{font-size:17px}.wk-h.today{background:var(--blue-soft)}
.wk-corner{border-left:0;left:0;z-index:3;align-items:flex-start;justify-content:flex-end;font-weight:700;font-size:13px;cursor:default}
.wk-r{background:#fff;border:0;border-bottom:1px solid var(--line);padding:8px;display:flex;gap:8px;align-items:center;font:inherit;color:var(--ink);cursor:pointer;position:sticky;left:0;z-index:1}
.wk-c{background:#fff;border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;gap:5px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.wk-c:hover,.wk-r:hover,.wk-h:hover,.mc:hover{background:var(--soft)}
.wk-c.today{background:#fafbff}.wk-c.offc{color:var(--mute)}
.wk-c .ct{font-size:12px;font-weight:600}.wk-c .mt{font-size:11px;color:var(--red-d);font-weight:700}
.mb{position:relative;height:14px;border-radius:5px;background:#dfe6f2;overflow:hidden}
.mb.offb{background:repeating-linear-gradient(45deg,#e4e7ee 0 5px,#f4f5f8 5px 10px)}
.mb i{position:absolute;top:0;bottom:0}
.mo-off{background:repeating-linear-gradient(45deg,#cfd4de 0 4px,#e8ebf1 4px 8px)}.mo-blk{background:repeating-linear-gradient(45deg,#f08a98 0 3px,#fde8eb 3px 6px)}
.mo-bk{background:var(--navy);border-right:1px solid #fff}.mo-bk.dim{background:#9db3e0}.mo-now{width:2px;background:var(--red);z-index:2}
/* mes */
.mon{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.mon-h{padding:6px;text-align:center;font-size:12px;color:var(--mute);font-weight:700;text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--soft)}
.mc{border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:#fff;min-height:112px;padding:4px 4px 12px;display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;position:relative;min-width:0}
.mc.out{background:#f8f9fb;color:#8a93a8}.mc.today .mn{background:var(--red);color:#fff;border-radius:999px;padding:0 7px}.mc.sel{box-shadow:inset 0 0 0 2px var(--navy)}.mc.offc{background:repeating-linear-gradient(45deg,#eef0f5 0 6px,#f8f9fb 6px 12px)}
.mn{font-weight:700;font-size:13px;display:flex;gap:4px;align-items:center;align-self:flex-start}.cnt{font-style:normal;font-size:11px;background:var(--blue-soft);color:var(--navy);padding:0 6px;border-radius:999px}
.mch{font-size:11px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid #9db3e0;background:#e3eafa;display:block}

/* ================= lógica de agenda ================= */
const ACTIVE=b=>b.status!=='cancelada';
const OPEN=b=>b.status==='pendiente'||b.status==='confirmada'||b.status==='en curso';
/* ================= DISPONIBILIDAD: unica fuente de validacion (Fase 3) =================
   Todo lo que decide "se puede o no" (reserva en linea, calendario, edicion, reprogramacion, arrastre,
   agenda del empleado, bloqueos, alertas) pasa por checkSlot(). Las reglas no se repiten en otros modulos.
   Nota: en produccion esta misma logica debe ejecutarse en el servidor, dentro de una transaccion. */
const PHOTO_RE=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
const KIND_LBL={descanso:'Descanso',bloqueo:'Bloqueado',ausencia:'Ausencia',vacaciones:'Vacaciones',libre:'Día libre'};
const feat=k=>!!(S.settings.features&&S.settings.features[k]);
function baseSched(p){const d={};for(let i=0;i<7;i++)d[i]=(p.days||[]).includes(i)?[p.from*60,p.to*60]:null;return {since:'',days:d,breaks:[]};}
function schedAt(p,date){const vs=p.sv&&p.sv.length?p.sv:[baseSched(p)];let cur=vs[0];for(const v of vs){if(v.since<=date)cur=v;}return cur;}
function subtractIv(base,ex){let out=base.map(x=>[x[0],x[1]]);for(const [s,e] of ex){const nx=[];for(const [a,b] of out){if(e<=a||s>=b){nx.push([a,b]);continue;}if(s>a)nx.push([a,s]);if(e<b)nx.push([e,b]);}out=nx;}return out;}
const blkSpan=k=>({from:k.date,to:k.dateTo||k.date,type:k.type||'bloqueo',all:(k.start<=0&&k.end>=1440)});
const occ=b=>[b.start-(b.pre||0),b.start+b.dur+(b.post||0)];
function dayModel(p,date){
  const st=S.settings, m={works:false,closed:st.closedDates.includes(date),outer:null,windows:[],off:[],absent:null,cap:0,booked:0,free:0,n:0};
  const mine=S.bookings.filter(b=>b.proId===p.id&&b.date===date&&ACTIVE(b)); m.n=mine.length;
  if(m.closed||!p.active) return m;
  const cfg=schedAt(p,date), dow=parseYmd(date).getDay(), w=cfg.days[dow]; if(!w) return m;
  const a=Math.max(w[0],st.open*60), z=Math.min(w[1],st.close*60); if(z<=a) return m;
  m.outer=[a,z];
  const ex=[]; (cfg.breaks||[]).forEach(b=>{if(!b.days||b.days.includes(dow))ex.push({from:b.from,to:b.to,kind:'descanso',label:b.label||''});});
  S.blocks.forEach(k=>{if(k.proId!==p.id)return;const sp=blkSpan(k);if(sp.from<=date&&sp.to>=date)ex.push({from:sp.all?0:k.start,to:sp.all?1440:k.end,kind:sp.type,label:k.reason||'',id:k.id,all:sp.all});});
  m.off=ex.map(x=>Object.assign({},x,{from:Math.max(x.from,a),to:Math.min(x.to,z)})).filter(x=>x.to>x.from);
  m.windows=subtractIv([[a,z]],ex.map(x=>[x.from,x.to]));
  m.absent=ex.find(x=>x.all)||null; m.works=m.windows.length>0;
  m.cap=m.windows.reduce((t,w2)=>t+w2[1]-w2[0],0);
  m.booked=mine.map(occ).reduce((t,iv)=>t+m.windows.reduce((u,w2)=>u+Math.max(0,Math.min(iv[1],w2[1])-Math.max(iv[0],w2[0])),0),0);
  m.free=Math.max(0,m.cap-m.booked); return m;
}
function resCheck(gid,date,s,e,ignoreId){
  const g=S.resources.find(x=>x.id===gid); if(!g) return 'El recurso requerido ya no existe.';
  if(!g.active) return g.name+' no está disponible (grupo desactivado).';
  const iv=S.bookings.filter(b=>ACTIVE(b)&&b.id!==ignoreId&&b.date===date&&(b.res||[]).includes(gid)).map(occ).filter(x=>s<x[1]&&x[0]<e).map(x=>[Math.max(x[0],s),Math.min(x[1],e)]);
  let mx=0; for(const t of [s,...iv.map(x=>x[0])]){mx=Math.max(mx,iv.filter(x=>x[0]<=t&&t<x[1]).length);}
  return mx+1>g.qty?'No hay '+g.name+' disponible en ese horario (capacidad: '+g.qty+').':'';
}
/* o: {proId,date,start,dur,pre,post,res:[ids],svcIds,ignoreId,noPast} -> '' si se puede, o el motivo */
function checkSlot(o){
  const p=proById(o.proId); if(!p) return 'Elige un profesional.';
  if(!p.active) return p.name+' está inactivo.';
  if(!(o.dur>0)) return 'Elige al menos un servicio.';
  if(!o.noPast&&o.date<todayS()) return 'No se pueden programar citas en fechas pasadas.';
  if(S.settings.closedDates.includes(o.date)) return 'El negocio está cerrado ese día.';
  const pre=o.pre||0, post=o.post||0, s=o.start-pre, e=o.start+o.dur+post, nm=p.name, m=dayModel(p,o.date), extra=(pre||post)?' (contando preparación y limpieza)':'';
  if(!m.outer) return nm+' no trabaja ese día.';
  if(o.start<m.outer[0]||o.start+o.dur>m.outer[1]) return 'Fuera del horario de '+nm+' ('+fmtTime(m.outer[0])+' a '+fmtTime(m.outer[1])+').';
  const miss=(o.svcIds||[]).filter(id=>!p.serviceIds.includes(id)).map(id=>svc(id)?svc(id).name:'?');
  if(miss.length) return nm+' no ofrece: '+miss.join(', ')+'.';
  if(!m.windows.some(w=>s>=w[0]&&e<=w[1])){
    if(s<m.outer[0]||e>m.outer[1]) return 'Fuera del horario de '+nm+extra+' ('+fmtTime(m.outer[0])+' a '+fmtTime(m.outer[1])+').';
    const x=m.off.find(z=>s<z.to&&z.from<e)||{kind:'bloqueo',label:'',from:0,to:0};
    const lb=x.label?' ('+x.label+')':'';
    if(x.kind==='descanso') return nm+' está en descanso de '+fmtTime(x.from)+' a '+fmtTime(x.to)+extra+'.';
    if(x.kind==='vacaciones') return nm+' está de vacaciones'+lb+'.';
    if(x.kind==='ausencia') return nm+' tiene una ausencia'+lb+' en ese horario.';
    if(x.kind==='libre') return nm+' tiene día libre'+lb+'.';
    return nm+' tiene ese horario bloqueado'+lb+extra+'.';
  }
  const bk=S.bookings.find(b=>ACTIVE(b)&&b.id!==o.ignoreId&&b.proId===p.id&&b.date===o.date&&s<occ(b)[1]&&occ(b)[0]<e);
  if(bk){const plain=o.start<bk.start+bk.dur&&bk.start<o.start+o.dur; return 'Se cruza con la cita de '+bk.name+' ('+fmtTime(bk.start)+' a '+fmtTime(bk.start+bk.dur)+')'+(plain?'':' por el tiempo de preparación o limpieza')+'.';}
  for(const gid of (feat('resources')?(o.res||[]):[])){const r=resCheck(gid,o.date,s,e,o.ignoreId); if(r) return r;}
  return '';
}
const slotArgs=(o,b)=>({proId:o.proId,date:o.date,start:o.start,dur:b.dur,pre:b.pre,post:b.post,res:b.res,svcIds:b.svcIds,ignoreId:o.ignoreId});
function freePros(o){

  return base.filter(p=>p.active&&(o.svcIds||[]).every(id=>p.serviceIds.includes(id))&&!checkSlot(Object.assign({},o,{proId:p.id})));

function slotsGeneric(o){
  const out=[]; if(!o.dur||o.proId==null||!o.date) return out;
  const now=new Date(), isToday=ymd(now)===o.date, lim=now.getHours()*60+now.getMinutes()+(o.lead||0);

function jobOf(svcIds){
  const ss=svcIds.map(svc).filter(Boolean), B=feat('buffers'), R=feat('resources');
  const lines=ss.map(s=>({name:s.name,price:s.price,dur:s.dur,pre:B?(s.pre||0):0,post:B?(s.post||0):0,res:R?(s.res||0):0}));

function gapsOf(p,date){
  const m=dayModel(p,date); if(!m.works) return [];
  const bk=S.bookings.filter(b=>b.proId===p.id&&b.date===date&&ACTIVE(b)).map(occ).sort((x,y)=>x[0]-y[0]);
  const lim=date===todayS()?Math.ceil(nowMin()/S.settings.step)*S.settings.step:0, out=[];
  subtractIv(m.windows,bk).forEach(g=>{const s=Math.max(g[0],lim);if(g[1]-s>=S.settings.step)out.push([s,g[1]]);});

}

/* alta de bloqueos / ausencias / vacaciones: devuelve {err} o {affected:[bookingIds nuevos en alerta]} */
function addBlock(o,force){
  if(!proById(o.proId)) return {err:'Elige un profesional.'};
  const to=o.dateTo||o.date;
  if(!o.date||to<o.date) return {err:'La fecha final no puede ser anterior a la inicial.'};
  if(o.date<todayS()) return {err:'Elige una fecha desde hoy en adelante.'};
  if(!o.all&&!(o.end>o.start)) return {err:'La hora final debe ser posterior a la inicial.'};
  if(S.blocks.length>400) return {err:'Demasiados bloqueos.'};
  const before=new Set(issuesFor(o.proId));
  const k={id:Date.now()+Math.random(),proId:o.proId,date:o.date,start:o.all?0:o.start,end:o.all?1440:o.end,reason:(o.reason||'').slice(0,60),type:o.type||'bloqueo'};
  if(to!==o.date) k.dateTo=to;
  S.blocks.push(k);
  const aff=issuesFor(o.proId).filter(id=>!before.has(id));
  if(aff.length&&!force){S.blocks.pop();return {affected:aff};}
  return {ok:true,block:k,affected:aff};
}

/* foto: valida tipo real por bytes, limita tamano/dimensiones y la reduce en el navegador (se pierde EXIF) */
function processPhoto(file,cb){
  if(!file) return cb('Elige un archivo.');
  if(file.size>5*1024*1024) return cb('La foto original supera 5 MB.');
  const fr=new FileReader();
  fr.onerror=()=>cb('No se pudo leer el archivo.');
  fr.onload=()=>{
    const buf=new Uint8Array(fr.result), u=buf.slice(0,12);
    const png=u[0]===0x89&&u[1]===0x50&&u[2]===0x4E&&u[3]===0x47, jpg=u[0]===0xFF&&u[1]===0xD8&&u[2]===0xFF, wbp=u[0]===0x52&&u[1]===0x49&&u[2]===0x46&&u[3]===0x46&&u[8]===0x57&&u[9]===0x45&&u[10]===0x42&&u[11]===0x50;
    if(!(png||jpg||wbp)) return cb('Formato no permitido. Usa PNG, JPG o WebP.');
    let bin=''; for(let i=0;i<buf.length;i+=8192) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));
    const img=new Image();
    img.onerror=()=>cb('La imagen está dañada o no se puede abrir.');
    img.onload=()=>{
      if(img.naturalWidth*img.naturalHeight>40e6||!img.naturalWidth) return cb('La imagen es demasiado grande en píxeles.');
      const c=document.createElement('canvas'), N=256; c.width=N; c.height=N; const x=c.getContext('2d');
      const m=Math.min(img.naturalWidth,img.naturalHeight), sx=(img.naturalWidth-m)/2, sy=(img.naturalHeight-m)/2;
      x.fillStyle='#fff'; x.fillRect(0,0,N,N); x.drawImage(img,sx,sy,m,m,0,0,N,N);
      let q=.85,out=''; for(;q>=.4;q-=.15){out=c.toDataURL('image/jpeg',q); if(out.length*.75<=150*1024) break;}
      if(out.length*.75>150*1024||!PHOTO_RE.test(out)) return cb('No se pudo reducir a 150 KB.');
      cb(null,out);
    };
    img.src='data:'+(png?'image/png':jpg?'image/jpeg':'image/webp')+';base64,'+btoa(bin);
  };
  fr.readAsArrayBuffer(file);
}

function adminAudit(){
  return h('div',{class:'card'},h('h2',null,ic('shield',18),'Registro de cambios'),h('p',{class:'mute'},'Solo lectura: no se puede editar ni borrar.'),

/* ===== v6.1: adaptacion a pantallas (solo presentacion; no cambia datos ni reglas) ===== */
(function(){
  function adapt(){
    document.querySelectorAll('.scroll table').forEach(function(t){
      if(!t.tHead||!t.tHead.rows[0]) return;
      var heads=Array.prototype.map.call(t.tHead.rows[0].cells,function(c){return c.textContent.trim();});
      t.classList.add('rt'); t.setAttribute('role','table');
      t.querySelectorAll('thead,tbody,tfoot').forEach(function(g){g.setAttribute('role','rowgroup');});
      t.querySelectorAll('tr').forEach(function(r){r.setAttribute('role','row');});
      t.querySelectorAll('th').forEach(function(c){c.setAttribute('role','columnheader');});
      t.querySelectorAll('tbody tr,tfoot tr').forEach(function(r){
        var i=0; Array.prototype.forEach.call(r.cells,function(c){
          c.setAttribute('role','cell'); c.setAttribute('data-label',c.colSpan>1?'':(heads[i]||'')); i+=c.colSpan||1;});
      });
    });
    document.querySelectorAll('input[type=number]:not([inputmode])').forEach(function(i){i.setAttribute('inputmode','numeric');});
  }
  var q=false;
  new MutationObserver(function(){ if(q) return; q=true; Promise.resolve().then(function(){q=false;adapt();}); }).observe(app,{childList:true,subtree:true});
  adapt();
})();
</script>
